name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

            - name: Debug Gradle wrapper
        working-directory: android
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== ANDROID FILES ==="
          ls -la

          echo "=== GRADLE FILES ==="
          ls -la gradle || true

          echo "=== WRAPPER FILES ==="
          ls -la gradle/wrapper || true

          echo "=== CHECK PROPERTIES ==="
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "gradle-wrapper.properties EXISTS"
          else
            echo "gradle-wrapper.properties DOES NOT EXIST"
          fi

          echo "=== CHECK GRADLEW ==="
          if [ -f "gradlew" ]; then
            echo "gradlew EXISTS"
            chmod +x gradlew
          else
            echo "gradlew DOES NOT EXIST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: em2m-controller-apk
          path: build/app/outputs/flutter-apk/app-release.apk
